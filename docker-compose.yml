# =============================================================================
# docker-compose.yml - local Docker profile
# Usage: docker compose -f docker-compose.yml --env-file .env.local up -d --build
# =============================================================================
#
# Started services:
#   postgres    - Manager PostgreSQL database         (MANAGER_DB_PORT  = 5432)
#   backend     - api-generator-back Spring Boot      (BACKEND_PORT     = 8080)
#   frontend    - React dashboard served by Nginx     (FRONTEND_PORT    = 3000)
#   mailpit     - Local SMTP inbox for account emails (MAILPIT_UI_PORT = 8025)
#   cloudbeaver - SQL web console                     (CLOUDBEAVER_PORT = 8978)
#
# Requirements: Docker Engine >= 24, Docker Compose v2
# Start: cp .env.local.example .env.local && docker compose -f docker-compose.yml --env-file .env.local up -d --build
# Stop: docker compose -f docker-compose.yml --env-file .env.local down
# =============================================================================

name: apigen-manager-docker

services:

  # Manager database
  postgres:
    image: postgres:16-alpine
    container_name: apigen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${MANAGER_DB_NAME:-apigen_manager}
      POSTGRES_USER:     ${MANAGER_DB_USER:-apigen}
      POSTGRES_PASSWORD: ${MANAGER_DB_PASSWORD:?MANAGER_DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${MANAGER_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MANAGER_DB_USER:-apigen}"]
      interval: 10s
      timeout: 5s
      retries: 5

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: apigen_docker_socket_proxy
    restart: unless-stopped
    environment:
      POST: "1"
      BUILD: "1"
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Spring Boot backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.back
    container_name: apigen_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
      mailpit:
        condition: service_started
    environment:
      # DataSource
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${MANAGER_DB_NAME:-apigen_manager}
      SPRING_DATASOURCE_USERNAME: ${MANAGER_DB_USER:-apigen}
      SPRING_DATASOURCE_PASSWORD: ${MANAGER_DB_PASSWORD:?MANAGER_DB_PASSWORD is required}

      # JWT / Security
      MANAGER_JWT_SECRET:    ${MANAGER_JWT_SECRET:?MANAGER_JWT_SECRET is required}
      MANAGER_JWT_ISSUER:    ${MANAGER_JWT_ISSUER:-api-generator-manager}
      MANAGER_JWT_EXP_SECONDS: ${MANAGER_JWT_EXP_SECONDS:-3600}

      # Bootstrap admin
      APP_ACCOUNT_BOOTSTRAP_EMAIL:    ${BOOTSTRAP_EMAIL:-user}
      APP_ACCOUNT_BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?BOOTSTRAP_PASSWORD is required}

      # Local account emails
      APP_ACCOUNT_EMAIL_VERIFICATION_ENABLED: ${APP_ACCOUNT_EMAIL_VERIFICATION_ENABLED:-true}
      APP_ACCOUNT_EMAIL_VERIFICATION_FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}/verify-email
      APP_ACCOUNT_PASSWORD_RESET_FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}/reset-password
      APP_ACCOUNT_EMAIL_VERIFICATION_FROM: ${APP_ACCOUNT_EMAIL_VERIFICATION_FROM:-no-reply@apigen.local}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: "false"

      # CORS
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}

      # OAuth2 redirect
      OAUTH2_SUCCESS_REDIRECT: http://localhost:3000/oauth2/callback
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # Generation: the template is bundled in the image at /app/api-generator-template.
      APP_GENERATION_JOBS_TEMPLATE_PATH: /app/api-generator-template
      APP_GENERATION_DOCKER_DEPLOYMENT_ENABLED: ${APP_GENERATION_DOCKER_DEPLOYMENT_ENABLED:-true}
      GENERATED_API_BOOTSTRAP_USER: ${GENERATED_API_BOOTSTRAP_USER:-admin}
      GENERATED_API_BOOTSTRAP_PASSWORD: ${GENERATED_API_BOOTSTRAP_PASSWORD:?GENERATED_API_BOOTSTRAP_PASSWORD is required}
      GENERATED_API_JWT_SECRET: ${GENERATED_API_JWT_SECRET:?GENERATED_API_JWT_SECRET is required}
      GENERATED_API_JWT_ISSUER: ${GENERATED_API_JWT_ISSUER:-generated-api}
      GENERATED_API_JWT_EXP_SECONDS: ${GENERATED_API_JWT_EXP_SECONDS:-3600}

      # Docker API through the socket proxy for generated APIs.
      DOCKER_HOST: tcp://docker-socket-proxy:2375

      # Profil Spring
      SPRING_PROFILES_ACTIVE: local

      # JVM
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # Optional shared job temp directory, useful for debugging.
      - generated_jobs:/tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s

  # Frontend Nginx / React
  frontend:
    build:
      context: ./api-generator-front
      dockerfile: Dockerfile.front
      args:
        VITE_API_BASE_URL:      http://localhost:${BACKEND_PORT:-8080}
        VITE_CLOUDBEAVER_URL:   http://localhost:${CLOUDBEAVER_PORT:-8978}
    container_name: apigen_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

  # Local SMTP inbox
  mailpit:
    image: axllent/mailpit:latest
    container_name: apigen_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # CloudBeaver SQL web console
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: apigen_cloudbeaver
    restart: unless-stopped
    ports:
      - "${CLOUDBEAVER_PORT:-8978}:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace

volumes:
  postgres_data:
  generated_jobs:
  cloudbeaver_data:


