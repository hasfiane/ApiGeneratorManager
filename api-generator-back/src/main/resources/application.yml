spring:
  application:
    name: ApiGeneratorManager
  profiles:
    default: local

  # SECURITY: Limit file upload size to prevent DoS
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

logging:
  level:
    com.api.generator.config.ApiRequestLoggingFilter: ${APP_REQUEST_LOG_LEVEL:WARN}
    com.api.generator.api.service.GenerationJobService: ${APP_GENERATION_LOG_LEVEL:INFO}

server:
  port: 8080

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS:*}
    exposed-headers: ${APP_CORS_EXPOSED_HEADERS:Content-Disposition,Content-Type}
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:true}
    max-age-seconds: ${APP_CORS_MAX_AGE_SECONDS:3600}

  account:
    default-plan: ${APP_ACCOUNT_DEFAULT_PLAN:FREE}
    legacy-plan: ${APP_ACCOUNT_LEGACY_PLAN:PRO}
    default-roles: ${APP_ACCOUNT_DEFAULT_ROLES:ROLE_USER}
    admin-unlimited-quotas: ${APP_ACCOUNT_ADMIN_UNLIMITED_QUOTAS:false}
    bootstrap-enabled: ${APP_ACCOUNT_BOOTSTRAP_ENABLED:false}
    bootstrap-reset-password-on-startup: ${APP_ACCOUNT_BOOTSTRAP_RESET_PASSWORD_ON_STARTUP:false}
    bootstrap-email: ${APP_ACCOUNT_BOOTSTRAP_EMAIL:}
    bootstrap-password: ${APP_ACCOUNT_BOOTSTRAP_PASSWORD:}
    bootstrap-roles: ${APP_ACCOUNT_BOOTSTRAP_ROLES:ROLE_ADMIN,ROLE_USER}
    bootstrap-plan: ${APP_ACCOUNT_BOOTSTRAP_PLAN:PRO}
    email-verification:
      enabled: ${APP_ACCOUNT_EMAIL_VERIFICATION_ENABLED:false}
      expiration-minutes: ${APP_ACCOUNT_EMAIL_VERIFICATION_EXP_MINUTES:30}
      frontend-verify-url: ${APP_ACCOUNT_EMAIL_VERIFICATION_FRONTEND_URL:http://localhost:5173/verify-email}
      reset-password-frontend-url: ${APP_ACCOUNT_PASSWORD_RESET_FRONTEND_URL:http://localhost:5173/reset-password}
      from: ${APP_ACCOUNT_EMAIL_VERIFICATION_FROM:no-reply@localhost}

  security:
    auth-rate-limit:
      max-attempts-per-window: ${APP_SECURITY_AUTH_RATE_LIMIT_MAX_ATTEMPTS:10}
      window-seconds: ${APP_SECURITY_AUTH_RATE_LIMIT_WINDOW_SECONDS:3600}
    # Set APP_TRUST_PROXY=true only when behind a trusted reverse proxy (nginx, ALB, Traefik)
    # that strips/rewrites X-Forwarded-For from untrusted sources. Default is false (safe).
    trust-proxy: ${APP_TRUST_PROXY:false}
    jdbc:
      allow-private-hosts: ${APP_SECURITY_JDBC_ALLOW_PRIVATE_HOSTS:true}
      allowed-hosts: ${APP_SECURITY_JDBC_ALLOWED_HOSTS:}
    jwt:
      secret: ${MANAGER_JWT_SECRET:}
      issuer: ${MANAGER_JWT_ISSUER:api-generator-manager}
      expiration-seconds: ${MANAGER_JWT_EXP_SECONDS:3600}
      cookie:
        name: ${MANAGER_JWT_COOKIE_NAME:APIGEN_AUTH}
        secure: ${MANAGER_JWT_COOKIE_SECURE:false}
        http-only: ${MANAGER_JWT_COOKIE_HTTP_ONLY:true}
        same-site: ${MANAGER_JWT_COOKIE_SAME_SITE:Lax}
        path: ${MANAGER_JWT_COOKIE_PATH:/}
        domain: ${MANAGER_JWT_COOKIE_DOMAIN:}
    data-encryption:
      current-key: ${APP_DATA_ENCRYPTION_KEY:}
      previous-keys: ${APP_DATA_ENCRYPTION_PREVIOUS_KEYS:}

  oauth2:
    success-redirect: ${OAUTH2_SUCCESS_REDIRECT:http://localhost:5173/oauth2/callback}

  generation:
    jobs:
      output-folder-name: ${APP_GENERATION_OUTPUT_FOLDER:generated-api}
      zip-file-name: ${APP_GENERATION_ZIP_FILE:generated-api.zip}
      compose-project-prefix: ${APP_GENERATION_COMPOSE_PROJECT_PREFIX:apigen_}
      compose-container-id-prefix: ${APP_GENERATION_COMPOSE_CONTAINER_PREFIX:compose:}
      docker-base-url-host: ${APP_GENERATION_DOCKER_HOST:localhost}
      docker-bind-host: ${APP_GENERATION_DOCKER_BIND_HOST:127.0.0.1}
      preview-bind-host: ${APP_PREVIEW_BIND_HOST:127.0.0.1}
      max-log-lines: ${APP_GENERATION_MAX_LOG_LINES:1500}
      default-log-tail: ${APP_GENERATION_DEFAULT_LOG_TAIL:200}
      command-timeout-seconds: ${APP_GENERATION_COMMAND_TIMEOUT_SECONDS:600}
      worker-enabled: ${APP_GENERATION_WORKER_ENABLED:true}
      retention-hours: ${APP_GENERATION_RETENTION_HOURS:24}
      preview-retention-hours: ${APP_PREVIEW_RETENTION_HOURS:12}
      preview-startup-timeout-seconds: ${APP_PREVIEW_STARTUP_TIMEOUT_SECONDS:120}
      preview-health-timeout-seconds: ${APP_PREVIEW_HEALTH_TIMEOUT_SECONDS:60}
      docker-deployment-enabled: ${APP_GENERATION_DOCKER_DEPLOYMENT_ENABLED:false}
      docker-request-enabled: ${APP_GENERATION_DOCKER_REQUEST_ENABLED:false}
      docker-hosted-route-enabled: ${APP_GENERATION_DOCKER_HOSTED_ROUTE_ENABLED:false}
      docker-hosted-route-prefix: ${APP_GENERATION_DOCKER_HOSTED_ROUTE_PREFIX:/generated/apis}
      docker-manager-network-name: ${APP_GENERATION_DOCKER_MANAGER_NETWORK_NAME:apigen-manager-docker_default}
      docker-fallback-port: ${APP_GENERATION_DOCKER_FALLBACK_PORT:18080}
      cloudbeaver-port: ${APP_GENERATION_CLOUDBEAVER_PORT:8978}
      db-port-offset: ${APP_GENERATION_DB_PORT_OFFSET:1}
      download-file-name-template: ${APP_GENERATION_DOWNLOAD_TEMPLATE:generated-api-%s.zip}
      temp-directory-prefix: ${APP_GENERATION_TEMP_PREFIX:api-generator-}
      # Container runtime used to start generated APIs: docker or podman.
      container-runtime: ${APP_CONTAINER_RUNTIME:docker}
      template-path: ${APP_TEMPLATE_PATH:./ApiGeneratorManager/api-generator-template}

# Generator defaults (NO database info here; DB comes from front-end request)
generator:
  output-dir: ./generated-api
  base-package: com.generated.api
  app-name: GeneratedApi
  clean-output-dir: true

  maven:
    group-id: com.generated
    artifact-id: generated-api
    version: 0.0.1-SNAPSHOT

  security:
    enabled: true
    bootstrap-username: ${GENERATED_API_BOOTSTRAP_USER:admin}
    bootstrap-password: ${GENERATED_API_BOOTSTRAP_PASSWORD:}
    jwt-secret: ${GENERATED_API_JWT_SECRET:}
    jwt-issuer: ${GENERATED_API_JWT_ISSUER:generated-api}
    jwt-expiration-seconds: ${GENERATED_API_JWT_EXP_SECONDS:3600}

  features:
    generate-open-api: true
    generate-docker: true
    generate-client-sdk-docs: true
