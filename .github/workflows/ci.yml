name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run backend verification
        run: mvn -B clean verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api-generator-front/package-lock.json

      - name: Install frontend dependencies
        working-directory: api-generator-front
        run: npm ci

      - name: Type-check frontend
        working-directory: api-generator-front
        run: npm run type-check

      - name: Lint frontend
        working-directory: api-generator-front
        run: npm run lint

      - name: Test frontend
        working-directory: api-generator-front
        run: npm run test

      - name: Build frontend
        working-directory: api-generator-front
        run: npm run build
